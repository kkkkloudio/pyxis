<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Il Crocevia — Esempio A: Luna Nera</title>
<style>
  /* ============================================
     ESEMPIO A — "LUNA NERA"
     Dark, minimal, elegante. Monocromatico + arancio bruciato
     ============================================ */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#0a0a0c;
    color:#c8c4bc;
    font-family:'Courier New', monospace;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 12px;
  }
  .frame {
    width:min(430px, 100%);
    border:1px solid #2a2a2e;
    border-radius:4px;
    background:#111114;
    padding:20px 16px;
  }
  .header {
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #2a2a2e; padding-bottom:12px; margin-bottom:16px;
  }
  .title { font-size:14px; letter-spacing:3px; text-transform:uppercase; color:#8a867e; }
  .luna { width:20px; height:20px; border-radius:50%; background:#c8c4bc;
    box-shadow:6px 0 0 0 #111114 inset; border:1px solid #3a3a3e; }

  .archetipi { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .archetipo {
    border:1px solid #2a2a2e; border-radius:4px; padding:12px 6px;
    text-align:center; cursor:pointer; transition:0.2s;
  }
  .archetipo:hover, .archetipo.sel { border-color:#c86a2e; background:#1a1410; }
  .archetipo svg { width:32px; height:32px; margin-bottom:6px; }
  .archetipo .nome { font-size:10px; letter-spacing:1px; text-transform:uppercase; color:#8a867e; }
  .archetipo.sel .nome { color:#c86a2e; }

  .cerchio {
    position:relative; width:280px; height:280px; margin:0 auto 16px;
    border:1px dashed #3a3a3e; border-radius:50%;
  }
  .cerchio .centro {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    background:#c86a2e; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 30px rgba(200,106,46,.3);
  }
  .cerchio .centro svg { width:32px; height:32px; }
  .cerchio .membro {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:#1a1a1e; border:1px solid #3a3a3e;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:0.2s;
  }
  .cerchio .membro:hover { border-color:#c86a2e; transform:scale(1.1); }
  .cerchio .membro svg { width:24px; height:24px; }
  .cerchio .membro .tag {
    position:absolute; bottom:-18px; font-size:8px; color:#6a665e;
    letter-spacing:1px; text-transform:uppercase; white-space:nowrap;
  }
  /* Posizioni 3 membri a 120° */
  .m1 { top:8%; left:50%; transform:translateX(-50%); }
  .m2 { bottom:18%; left:10%; }
  .m3 { bottom:18%; right:10%; }

  .segnali { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .segnale {
    width:44px; height:44px; border:1px solid #2a2a2e; border-radius:4px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:#151518; transition:0.2s;
  }
  .segnale:hover, .segnale.attivo { border-color:#c86a2e; background:#1a1410; }
  .segnale svg { width:20px; height:20px; }

  .info {
    border-top:1px solid #2a2a2e; padding-top:12px; font-size:11px;
    color:#6a665e; line-height:1.6;
  }
  .info b { color:#c86a2e; font-weight:normal; letter-spacing:1px; }

  .back {
    margin-top:16px; font-size:10px; color:#4a4640; letter-spacing:2px;
    text-transform:uppercase; text-align:center;
  }
  .back a { color:#6a665e; text-decoration:none; }
</style>
</head>
<body>

<!-- ICONE SVG (stile minimal/lineare) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Strega: cappello a cono + luna -->
    <symbol id="i-strega" viewBox="0 0 24 24">
      <path d="M12 2 L16 12 L8 12 Z" fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <line x1="5" y1="12" x2="19" y2="12" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M18 6 a3 3 0 1 0 3 4 a2.5 2.5 0 1 1 -3 -4" fill="#c8c4bc"/>
    </symbol>
    <!-- Stregone: cappuccio + occhio -->
    <symbol id="i-stregone" viewBox="0 0 24 24">
      <path d="M12 3 C7 3 5 8 5 14 L5 20 L19 20 L19 14 C19 8 17 3 12 3 Z"
        fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <circle cx="12" cy="12" r="2.5" fill="none" stroke="#c8c4bc" stroke-width="1"/>
      <circle cx="12" cy="12" r="0.8" fill="#c8c4bc"/>
    </symbol>
    <!-- Sciamano: tamburo + corna -->
    <symbol id="i-sciamano" viewBox="0 0 24 24">
      <circle cx="12" cy="13" r="6" fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M8 8 C6 6 5 4 5 2 M16 8 C18 6 19 4 19 2"
        fill="none" stroke="#c8c4bc" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="9" y1="13" x2="15" y2="13" stroke="#c8c4bc" stroke-width="1"/>
    </symbol>
    <!-- Guaritore: foglia + croce -->
    <symbol id="i-guaritore" viewBox="0 0 24 24">
      <path d="M12 21 C12 14 14 8 20 4 C20 12 16 18 12 21 Z"
        fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M12 21 C12 16 10 12 6 9" fill="none" stroke="#c8c4bc" stroke-width="1"/>
      <line x1="12" y1="10" x2="12" y2="14" stroke="#c8c4bc" stroke-width="1.2"/>
      <line x1="10" y1="12" x2="14" y2="12" stroke="#c8c4bc" stroke-width="1.2"/>
    </symbol>
    <!-- Veggente: occhio + sfera -->
    <symbol id="i-veggente" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#c8c4bc" stroke-width="1"/>
      <path d="M4 12 Q12 6 20 12 Q12 18 4 12 Z" fill="none" stroke="#c8c4bc" stroke-width="1"/>
      <circle cx="12" cy="12" r="2.5" fill="#c8c4bc"/>
    </symbol>
    <!-- Viandante: punto + sentiero -->
    <symbol id="i-viandante" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="3" fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M4 20 Q8 16 12 18 Q16 20 20 16" fill="none" stroke="#c8c4bc" stroke-width="1"/>
    </symbol>
    <!-- Segnali -->
    <symbol id="s-candela" viewBox="0 0 24 24">
      <rect x="10" y="11" width="4" height="9" fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M12 3 C13 5 14 6 14 8 a2 2 0 0 1 -4 0 C10 6 11 5 12 3 Z" fill="#c86a2e"/>
    </symbol>
    <symbol id="s-pericolo" viewBox="0 0 24 24">
      <path d="M12 3 L21 20 L3 20 Z" fill="none" stroke="#c86a2e" stroke-width="1.5"/>
      <line x1="12" y1="10" x2="12" y2="14" stroke="#c86a2e" stroke-width="1.5"/>
      <circle cx="12" cy="17" r="0.8" fill="#c86a2e"/>
    </symbol>
    <symbol id="s-ok" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M8 12 L11 15 L16 9" fill="none" stroke="#c8c4bc" stroke-width="1.5"/>
    </symbol>
    <symbol id="s-aiuto" viewBox="0 0 24 24">
      <path d="M7 11 L12 4 L17 11 L17 20 L7 20 Z" fill="none" stroke="#c8c4bc" stroke-width="1.2"/>
      <path d="M12 8 L12 14 M9 11 L15 11" stroke="#c86a2e" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<div class="frame">
  <div class="header">
    <span class="title">Il Crocevia</span>
    <div class="luna"></div>
  </div>

  <div style="font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#6a665e; margin-bottom:10px; text-align:center;">
    Scegli la tua via
  </div>

  <div class="archetipi">
    <div class="archetipo sel" onclick="sel(this)">
      <svg><use href="#i-strega"/></svg>
      <div class="nome">Strega</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-stregone"/></svg>
      <div class="nome">Stregone</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-sciamano"/></svg>
      <div class="nome">Sciamano</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-guaritore"/></svg>
      <div class="nome">Guaritore</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-veggente"/></svg>
      <div class="nome">Veggente</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-viandante"/></svg>
      <div class="nome">Viandante</div>
    </div>
  </div>

  <div style="font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#6a665e; margin-bottom:10px; text-align:center;">
    Il tuo cerchio · Milano
  </div>

  <div class="cerchio">
    <div class="centro">
      <svg><use href="#i-strega" style="color:#0a0a0c"/></svg>
    </div>
    <div class="membro m1">
      <svg><use href="#i-veggente"/></svg>
      <span class="tag">LunaRossa</span>
    </div>
    <div class="membro m2">
      <svg><use href="#i-sciamano"/></svg>
      <span class="tag">CorvoNero</span>
    </div>
    <div class="membro m3">
      <svg><use href="#i-guaritore"/></svg>
      <span class="tag">Salice</span>
    </div>
  </div>

  <div class="segnali">
    <div class="segnale attivo" title="Rituale in corso">
      <svg><use href="#s-candela"/></svg>
    </div>
    <div class="segnale" title="Pericolo">
      <svg><use href="#s-pericolo"/></svg>
    </div>
    <div class="segnale" title="Tutto bene">
      <svg><use href="#s-ok"/></svg>
    </div>
    <div class="segnale" title="Cerco aiuto">
      <svg><use href="#s-aiuto"/></svg>
    </div>
  </div>

  <div class="info">
    <b>TU</b> — Strega · Milano<br/>
    Nel tuo cerchio: <b>3</b> presenze. LunaRossa ha acceso una <b>candela</b>.
  </div>
</div>

<div class="back">
  <a href="index.html">← Torna agli esempi</a> · Esempio A: Luna Nera
</div>

<script>
  function sel(el) {
    document.querySelectorAll('.archetipo').forEach(a => a.classList.remove('sel'));
    el.classList.add('sel');
  }
</script>
</body>
</html>
