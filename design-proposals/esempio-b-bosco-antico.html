<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Il Crocevia — Esempio B: Bosco Antico</title>
<style>
  /* ============================================
     ESEMPIO B — "BOSCO ANTICO"
     Naturale, caldo, radicato nella terra. Verdi scuri, marroni, texture
     ============================================ */
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background:#1a1410;
    background-image:
      radial-gradient(ellipse at 20% 80%, rgba(74,58,42,.4) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(58,74,42,.3) 0%, transparent 50%);
    color:#d4c4a8;
    font-family:Georgia, 'Palatino Linotype', serif;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 12px;
  }
  .frame {
    width:min(430px, 100%);
    border:2px solid #4a3a2a;
    border-radius:16px;
    background:linear-gradient(180deg, #241c14 0%, #1a1410 100%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.5), 0 8px 32px rgba(0,0,0,.4);
    padding:20px 16px;
  }
  .header {
    display:flex; justify-content:space-between; align-items:center;
    border-bottom:1px solid #3a2e20; padding-bottom:12px; margin-bottom:16px;
  }
  .title {
    font-size:16px; letter-spacing:2px; color:#a89468;
    text-shadow:1px 1px 2px rgba(0,0,0,.5);
  }
  .albero { width:24px; height:24px; }

  .archetipi { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:20px; }
  .archetipo {
    border:1px solid #3a2e20; border-radius:12px; padding:12px 6px;
    text-align:center; cursor:pointer; transition:0.2s;
    background:rgba(36,28,20,.6);
  }
  .archetipo:hover, .archetipo.sel {
    border-color:#8a6a3a; background:rgba(74,58,42,.4);
    box-shadow:0 0 12px rgba(138,106,58,.2);
  }
  .archetipo svg { width:32px; height:32px; margin-bottom:6px; }
  .archetipo .nome {
    font-size:10px; letter-spacing:1px; color:#8a7a5e;
    font-style:italic;
  }
  .archetipo.sel .nome { color:#d4a84a; }

  .cerchio {
    position:relative; width:280px; height:280px; margin:0 auto 16px;
    border:2px dashed #4a3a2a; border-radius:50%;
    background:radial-gradient(circle, rgba(58,74,42,.15) 0%, transparent 70%);
  }
  .cerchio .centro {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    background:linear-gradient(145deg, #4a3a2a, #3a2e20);
    border:2px solid #8a6a3a;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px rgba(138,106,58,.3), inset 0 2px 8px rgba(0,0,0,.3);
  }
  .cerchio .centro svg { width:32px; height:32px; }
  .cerchio .membro {
    position:absolute; width:48px; height:48px; border-radius:50%;
    background:linear-gradient(145deg, #2a2018, #1a1410);
    border:1px solid #4a3a2a;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:0.2s;
  }
  .cerchio .membro:hover {
    border-color:#8a6a3a; transform:scale(1.1);
    box-shadow:0 0 12px rgba(138,106,58,.3);
  }
  .cerchio .membro svg { width:24px; height:24px; }
  .cerchio .membro .tag {
    position:absolute; bottom:-18px; font-size:8px; color:#6a5a3e;
    font-style:italic; white-space:nowrap;
  }
  .m1 { top:8%; left:50%; transform:translateX(-50%); }
  .m2 { bottom:18%; left:10%; }
  .m3 { bottom:18%; right:10%; }

  .segnali { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; }
  .segnale {
    width:44px; height:44px; border:1px solid #3a2e20; border-radius:12px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:rgba(36,28,20,.6); transition:0.2s;
  }
  .segnale:hover, .segnale.attivo {
    border-color:#8a6a3a; background:rgba(74,58,42,.4);
    box-shadow:0 0 10px rgba(138,106,58,.2);
  }
  .segnale svg { width:20px; height:20px; }

  .info {
    border-top:1px solid #3a2e20; padding-top:12px; font-size:12px;
    color:#8a7a5e; line-height:1.6; font-style:italic;
  }
  .info b { color:#d4a84a; font-weight:normal; }

  .back {
    margin-top:16px; font-size:10px; color:#5a4a38;
    font-style:italic; text-align:center;
  }
  .back a { color:#8a7a5e; text-decoration:none; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- Strega: cappello + foglia -->
    <symbol id="i-strega" viewBox="0 0 24 24">
      <path d="M12 2 L17 13 L7 13 Z" fill="#4a5a3a" stroke="#8a6a3a" stroke-width="1"/>
      <ellipse cx="12" cy="13" rx="8" ry="2" fill="#3a2e20" stroke="#8a6a3a" stroke-width="1"/>
      <path d="M12 6 Q14 8 13 11 M12 6 Q10 8 11 11" fill="none" stroke="#5a7a4a" stroke-width="0.8"/>
    </symbol>
    <!-- Stregone: cappuccio + bastone -->
    <symbol id="i-stregone" viewBox="0 0 24 24">
      <path d="M12 3 C7 3 5 8 5 14 L5 21 L19 21 L19 14 C19 8 17 3 12 3 Z"
        fill="#2a3a2a" stroke="#8a6a3a" stroke-width="1"/>
      <circle cx="12" cy="12" r="2.5" fill="#1a1410" stroke="#d4a84a" stroke-width="0.8"/>
      <line x1="19" y1="6" x2="19" y2="21" stroke="#6a4a2a" stroke-width="1.5"/>
      <circle cx="19" cy="5" r="1.5" fill="#8a6a3a"/>
    </symbol>
    <!-- Sciamano: tamburo + piume -->
    <symbol id="i-sciamano" viewBox="0 0 24 24">
      <circle cx="12" cy="14" r="6" fill="#3a2e20" stroke="#8a6a3a" stroke-width="1.2"/>
      <path d="M8 9 C6 6 5 4 5 2 M16 9 C18 6 19 4 19 2"
        fill="none" stroke="#d4a84a" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M5 2 L3 5 M5 2 L7 5 M19 2 L17 5 M19 2 L21 5"
        fill="none" stroke="#8a6a3a" stroke-width="0.8"/>
      <line x1="9" y1="14" x2="15" y2="14" stroke="#d4a84a" stroke-width="1"/>
    </symbol>
    <!-- Guaritore: erba + mortaio -->
    <symbol id="i-guaritore" viewBox="0 0 24 24">
      <path d="M12 21 C12 14 14 8 20 4 C20 12 16 18 12 21 Z" fill="#3a5a2a" stroke="#8a6a3a" stroke-width="1"/>
      <path d="M12 21 C12 16 10 12 6 9" fill="none" stroke="#5a7a4a" stroke-width="0.8"/>
      <path d="M6 18 L18 18 L16 21 L8 21 Z" fill="#2a2018" stroke="#8a6a3a" stroke-width="1"/>
    </symbol>
    <!-- Veggente: occhio + cristallo -->
    <symbol id="i-veggente" viewBox="0 0 24 24">
      <path d="M12 2 L18 9 L12 22 L6 9 Z" fill="#3a3a4a" stroke="#d4a84a" stroke-width="1"/>
      <path d="M12 2 L12 22 M6 9 L18 9" fill="none" stroke="#8a8a9a" stroke-width="0.5"/>
      <circle cx="12" cy="9" r="1.5" fill="#d4a84a"/>
    </symbol>
    <!-- Viandante: impronta + sentiero -->
    <symbol id="i-viandante" viewBox="0 0 24 24">
      <ellipse cx="12" cy="8" rx="3" ry="4" fill="none" stroke="#8a6a3a" stroke-width="1.2"/>
      <circle cx="10.5" cy="5.5" r="0.6" fill="#8a6a3a"/>
      <circle cx="13.5" cy="5.5" r="0.6" fill="#8a6a3a"/>
      <path d="M4 20 Q8 16 12 18 Q16 20 20 16" fill="none" stroke="#5a4a38" stroke-width="1.2"/>
    </symbol>
    <!-- Segnali -->
    <symbol id="s-candela" viewBox="0 0 24 24">
      <rect x="10" y="11" width="4" height="9" rx="1" fill="#3a2e20" stroke="#8a6a3a" stroke-width="1"/>
      <path d="M12 3 C13.5 5.5 14.5 7 14.5 9 a2.5 2.5 0 0 1 -5 0 C9.5 7 10.5 5.5 12 3 Z" fill="#d4a84a"/>
      <circle cx="12" cy="8" r="4" fill="#d4a84a" opacity="0.15"/>
    </symbol>
    <symbol id="s-pericolo" viewBox="0 0 24 24">
      <path d="M12 3 C14 8 19 10 19 15 a7 7 0 0 1 -14 0 C5 10 10 8 12 3 Z" fill="#5a2a1a" stroke="#d46a4a" stroke-width="1"/>
      <path d="M12 10 C13 12 14 13 14 15 a2 2 0 0 1 -4 0 C10 13 11 12 12 10 Z" fill="#d46a4a"/>
    </symbol>
    <symbol id="s-ok" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="#2a3a2a" stroke="#8a6a3a" stroke-width="1.2"/>
      <path d="M8 12 L11 15 L16 9" fill="none" stroke="#7a9a5a" stroke-width="1.5"/>
    </symbol>
    <symbol id="s-aiuto" viewBox="0 0 24 24">
      <path d="M7 12 C7 8 9 5 12 5 C15 5 17 8 17 12 L17 20 L7 20 Z"
        fill="none" stroke="#8a6a3a" stroke-width="1.2"/>
      <path d="M12 9 L12 15 M9 12 L15 12" stroke="#d4a84a" stroke-width="1.5"/>
    </symbol>
  </defs>
</svg>

<div class="frame">
  <div class="header">
    <span class="title">❦ Il Crocevia</span>
    <svg class="albero" viewBox="0 0 24 24">
      <path d="M12 2 L12 22 M12 6 L7 10 M12 6 L17 10 M12 11 L6 15 M12 11 L18 15"
        fill="none" stroke="#8a6a3a" stroke-width="1.2"/>
      <circle cx="12" cy="4" r="2" fill="#5a7a4a"/>
    </svg>
  </div>

  <div style="font-size:11px; letter-spacing:2px; color:#8a7a5e; margin-bottom:10px; text-align:center; font-style:italic;">
    Scegli la tua via, viandante
  </div>

  <div class="archetipi">
    <div class="archetipo sel" onclick="sel(this)">
      <svg><use href="#i-strega"/></svg>
      <div class="nome">Strega</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-stregone"/></svg>
      <div class="nome">Stregone</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-sciamano"/></svg>
      <div class="nome">Sciamano</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-guaritore"/></svg>
      <div class="nome">Guaritore</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-veggente"/></svg>
      <div class="nome">Veggente</div>
    </div>
    <div class="archetipo" onclick="sel(this)">
      <svg><use href="#i-viandante"/></svg>
      <div class="nome">Viandante</div>
    </div>
  </div>

  <div style="font-size:11px; letter-spacing:2px; color:#8a7a5e; margin-bottom:10px; text-align:center; font-style:italic;">
    Il tuo cerchio · terra di Milano
  </div>

  <div class="cerchio">
    <div class="centro">
      <svg><use href="#i-strega"/></svg>
    </div>
    <div class="membro m1">
      <svg><use href="#i-veggente"/></svg>
      <span class="tag">LunaRossa</span>
    </div>
    <div class="membro m2">
      <svg><use href="#i-sciamano"/></svg>
      <span class="tag">CorvoNero</span>
    </div>
    <div class="membro m3">
      <svg><use href="#i-guaritore"/></svg>
      <span class="tag">Salice</span>
    </div>
  </div>

  <div class="segnali">
    <div class="segnale attivo" title="Rituale in corso">
      <svg><use href="#s-candela"/></svg>
    </div>
    <div class="segnale" title="Pericolo">
      <svg><use href="#s-pericolo"/></svg>
    </div>
    <div class="segnale" title="Tutto bene">
      <svg><use href="#s-ok"/></svg>
    </div>
    <div class="segnale" title="Cerco aiuto">
      <svg><use href="#s-aiuto"/></svg>
    </div>
  </div>

  <div class="info">
    <b>Tu</b> — Strega del Bosco · Milano<br/>
    Nel tuo cerchio: <b>3</b> anime. LunaRossa ha acceso una <b>candela</b>.
  </div>
</div>

<div class="back">
  <a href="index.html">← Torna agli esempi</a> · Esempio B: Bosco Antico
</div>

<script>
  function sel(el) {
    document.querySelectorAll('.archetipo').forEach(a => a.classList.remove('sel'));
    el.classList.add('sel');
  }
</script>
</body>
</html>
