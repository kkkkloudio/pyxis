<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bussola delle Anime</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    /* Pergamena antica come sfondo */
    background:#e8dcc0;
    background-image:
      radial-gradient(ellipse 40% 30% at 20% 10%, rgba(180,150,100,.25), transparent),
      radial-gradient(ellipse 30% 25% at 80% 20%, rgba(170,140,90,.2), transparent),
      radial-gradient(ellipse 50% 35% at 50% 90%, rgba(160,130,80,.18), transparent),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='p'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.04' numOctaves='4'/%3E%3C/filter%3E%3Crect width='300' height='300' filter='url(%23p)' opacity='0.08'/%3E%3C/svg%3E"),
      url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
    font-family:'IM Fell English', 'Cormorant Garamond', Georgia, serif;
    color:#3a2a1a;
  }

  .app {
    width:min(380px, 100%);
    background:rgba(255,250,235,.4);
    border:2px solid #8a6a3a;
    border-radius:8px;
    box-shadow:
      0 4px 8px rgba(100,70,30,.2),
      0 12px 32px rgba(80,50,20,.25),
      inset 0 0 40px rgba(180,150,100,.15);
    padding:20px;
    position:relative;
  }

  /* Cera colata in alto (come la tua foto) */
  .cera {
    position:absolute; top:-2px; left:0; right:0; height:30px;
    background:
      radial-gradient(ellipse 20px 15px at 10% 0%, #b8321e 40%, transparent 41%),
      radial-gradient(ellipse 25px 20px at 30% 0%, #b8321e 40%, transparent 41%),
      radial-gradient(ellipse 18px 12px at 50% 0%, #b8321e 40%, transparent 41%),
      radial-gradient(ellipse 22px 18px at 70% 0%, #b8321e 40%, transparent 41%),
      radial-gradient(ellipse 20px 15px at 90% 0%, #b8321e 40%, transparent 41%);
    border-radius:0 0 4px 4px;
  }

  /* Header: luna | titolo | candela */
  .header {
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; margin-top:8px;
  }
  .icona {
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,250,235,.6);
    border:2px solid #6b5230;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .icona svg { width:24px; height:24px; }

  .titolo-wrap { text-align:center; }
  .titolo {
    font-family:'Cinzel', serif;
    font-size:18px; letter-spacing:2px; color:#3a2a1a; font-weight:600;
  }
  .sottotitolo {
    font-size:12px; color:#6b5230; font-style:italic;
  }

  /* BUSSOLA CENTRALE */
  .bussola-wrap {
    position:relative;
    width:260px; height:260px;
    margin:0 auto 16px;
  }
  .bussola { width:100%; height:100%; }

  /* Lancette SVG - partono dal centro (130,130) */
  .lancetta {
    transform-origin:130px 130px;
    transition:transform 1s ease, opacity .3s;
  }
  /* Posizioni iniziali delle 3 lancette */
  .lancetta-grande { transform:rotate(-45deg); }   /* nord-ovest */
  .lancetta-media { transform:rotate(40deg); }    /* nord-est */
  .lancetta-piccola { transform:rotate(160deg); } /* sud-est */

  /* Centro della bussola */
  .centro-dot {
    position:absolute; top:50%; left:50%;
    width:16px; height:16px; margin:-8px 0 0 -8px;
    background:#3a2a1a; border-radius:50%;
    border:2px solid #b8963e;
    box-shadow:0 0 8px rgba(184,150,62,.5);
    z-index:10;
  }

  /* LEGENDA SEMPLICE */
  .legenda {
    display:flex; flex-direction:column; gap:8px;
    margin-bottom:16px;
  }
  .legenda-item {
    display:flex; align-items:center; gap:10px;
    padding:8px 12px;
    border:1px solid #a08a5a; border-radius:4px;
    background:rgba(255,250,235,.5);
    cursor:pointer; transition:.2s;
  }
  .legenda-item:hover, .legenda-item.sel {
    background:rgba(184,150,62,.15);
    border-color:#b8963e;
  }
  .legenda-item .linea {
    width:30px; height:4px; border-radius:2px; flex-shrink:0;
  }
  .linea.grande { background:#6b5a8a; height:6px; }
  .linea.media { background:#4a3a6a; height:4px; }
  .linea.piccola { background:#b8963e; height:3px; }

  .legenda-item .testo { flex:1; }
  .legenda-item .nome { font-weight:600; font-size:14px; color:#2a1a0a; }
  .legenda-item .dett { font-size:11px; color:#6b5230; font-style:italic; }
  .legenda-item .tag {
    font-size:10px; color:#8a6a3a; font-family:'Cinzel',serif;
    letter-spacing:1px; text-transform:uppercase;
  }

  /* AZIONI IN BASSO (3 icone come la tua foto) */
  .azioni {
    display:flex; justify-content:center; gap:20px;
    padding-top:12px; border-top:1px solid #a08a5a;
  }
  .azione {
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f8f0d8, #e0d0a8);
    border:3px solid #6b5230;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.2s;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
    position:relative;
  }
  .azione:hover { transform:translateY(-2px); }
  .azione:active { transform:scale(.95); }
  .azione svg { width:28px; height:28px; }
  .azione .badge {
    position:absolute; top:-4px; right:-4px;
    width:18px; height:18px; border-radius:50%;
    background:#b8321e; border:2px solid #f8f0d8;
    font-size:10px; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-family:'Cinzel',serif; font-weight:600;
  }

  /* Segnalibro laterale (come la tua foto) */
  .segnalibro {
    position:absolute; right:-6px; top:100px;
    width:24px; height:70px;
    background:linear-gradient(90deg, #d4b88a, #b8986a);
    border:1px solid #6b5230; border-left:none;
    border-radius:0 4px 4px 0;
    cursor:pointer;
    box-shadow:2px 2px 4px rgba(0,0,0,.3);
  }
  .segnalibro::after {
    content:''; position:absolute; bottom:-12px; left:0;
    border-left:12px solid #b8986a;
    border-right:12px solid #b8986a;
    border-bottom:12px solid transparent;
  }

  .piè {
    text-align:center; margin-top:12px;
    font-size:10px; color:#6b5230; font-style:italic;
  }
</style>
</head>
<body>

<div class="app">
  <div class="cera"></div>
  <div class="segnalibro" title="Menu"></div>

  <!-- HEADER -->
  <div class="header">
    <div class="icona">
      <!-- Luna crescente -->
      <svg viewBox="0 0 24 24"><path d="M18 14a8 8 0 1 1-9-11 7 7 0 1 0 9 11" fill="none" stroke="#3a2a1a" stroke-width="1.5"/></svg>
    </div>
    <div class="titolo-wrap">
      <div class="titolo">Bussola delle Anime</div>
      <div class="sottotitolo">Milano · tema Strega</div>
    </div>
    <div class="icona">
      <!-- Candela -->
      <svg viewBox="0 0 24 24">
        <ellipse cx="12" cy="6" rx="3" ry="4" fill="#d4a020"/>
        <rect x="9" y="10" width="6" height="11" rx="1" fill="#e8dcc0" stroke="#3a2a1a" stroke-width="1"/>
      </svg>
    </div>
  </div>

  <!-- BUSSOLA -->
  <div class="bussola-wrap">
    <svg class="bussola" viewBox="0 0 260 260">
      <!-- Cerchi concentrici (stile pergamena) -->
      <circle cx="130" cy="130" r="125" fill="none" stroke="#6b5230" stroke-width="3"/>
      <circle cx="130" cy="130" r="115" fill="none" stroke="#8a6a3a" stroke-width="1" stroke-dasharray="4 3"/>
      <circle cx="130" cy="130" r="95" fill="none" stroke="#a08a5a" stroke-width="1"/>
      <circle cx="130" cy="130" r="70" fill="none" stroke="#a08a5a" stroke-width="1"/>
      <circle cx="130" cy="130" r="45" fill="none" stroke="#a08a5a" stroke-width="1"/>

      <!-- Linee cardinali -->
      <g stroke="#8a6a3a" stroke-width="1.5">
        <line x1="130" y1="130" x2="130" y2="15"/>
        <line x1="130" y1="130" x2="130" y2="245"/>
        <line x1="130" y1="130" x2="15" y2="130"/>
        <line x1="130" y1="130" x2="245" y2="130"/>
      </g>

      <!-- Lettere cardinali -->
      <g font-family="Cinzel,serif" font-size="14" fill="#3a2a1a" text-anchor="middle" font-weight="600">
        <text x="130" y="12">N</text>
        <text x="130" y="255">S</text>
        <text x="252" y="135">E</text>
        <text x="10" y="135">O</text>
      </g>

      <!-- Simboli/rune decorative (8 direzioni) -->
      <g stroke="#8a6a3a" stroke-width="1" opacity="0.6">
        <path d="M130 25 l0 10 M125 30 l5 -5 M135 30 l-5 -5"/>
        <path d="M130 225 l0 10 M125 230 l5 5 M135 230 l-5 5"/>
        <path d="M25 130 l10 0 M30 125 l-5 5 M30 135 l-5 -5"/>
        <path d="M225 130 l10 0 M230 125 l5 5 M230 135 l5 -5"/>
      </g>

      <!-- ===== LANCETTA PICCOLA (POI - dorata, sottile) ===== -->
      <g class="lancetta lancetta-piccola">
        <polygon points="130,130 126,75 130,60 134,75" fill="#b8963e" stroke="#6b5230" stroke-width="1"/>
        <circle cx="130" cy="60" r="4" fill="#b8963e" stroke="#6b5230" stroke-width="1"/>
      </g>

      <!-- ===== LANCETTA MEDIA (secondo utente - viola scuro) ===== -->
      <g class="lancetta lancetta-media">
        <polygon points="130,130 125,85 130,65 135,85" fill="#4a3a6a" stroke="#3a2a1a" stroke-width="1.5"/>
        <circle cx="130" cy="65" r="5" fill="#4a3a6a" stroke="#3a2a1a" stroke-width="1"/>
      </g>

      <!-- ===== LANCETTA GRANDE (utente più vicino - viola chiaro, spessa) ===== -->
      <g class="lancetta lancetta-grande">
        <polygon points="130,130 123,90 130,65 137,90" fill="#8a7ab8" stroke="#3a2a1a" stroke-width="2"/>
        <circle cx="130" cy="65" r="7" fill="#8a7ab8" stroke="#3a2a1a" stroke-width="1.5"/>
        <circle cx="130" cy="65" r="11" fill="none" stroke="#8a7ab8" stroke-width="1" stroke-dasharray="2 2" opacity="0.5"/>
      </g>

      <!-- Centro fisso -->
      <circle cx="130" cy="130" r="10" fill="#3a2a1a" stroke="#b8963e" stroke-width="2"/>
      <circle cx="130" cy="130" r="4" fill="#b8963e"/>
    </svg>
    <div class="centro-dot"></div>
  </div>

  <!-- LEGENDA -->
  <div class="legenda">
    <div class="legenda-item sel" data-tipo="grande">
      <div class="linea grande"></div>
      <div class="testo">
        <div class="nome">Luna Rossa</div>
        <div class="dett">Veggente · candela accesa</div>
      </div>
      <div class="tag">più vicina</div>
    </div>
    <div class="legenda-item" data-tipo="media">
      <div class="linea media"></div>
      <div class="testo">
        <div class="nome">Corvo Nero</div>
        <div class="dett">Sciamano · silenzioso</div>
      </div>
      <div class="tag">seconda</div>
    </div>
    <div class="legenda-item" data-tipo="piccola">
      <div class="linea piccola"></div>
      <div class="testo">
        <div class="nome">Quercia dei Sussurri</div>
        <div class="dett">Luogo sacro · congrega</div>
      </div>
      <div class="tag">il sacro</div>
    </div>
  </div>

  <!-- AZIONI (3 icone come la tua foto) -->
  <div class="azioni">
    <div class="azione" title="Accendi candela">
      <svg viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="3" ry="4" fill="#d4a020"/>
        <ellipse cx="12" cy="5" rx="1.5" ry="2.5" fill="#f0d060"/>
        <rect x="9" y="9" width="6" height="12" rx="1" fill="#e8dcc0" stroke="#3a2a1a" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="azione" title="Scrivi lettera">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="6" width="18" height="13" rx="1" fill="#f0e6cc" stroke="#3a2a1a" stroke-width="1.5"/>
        <path d="M3 6 L12 13 L21 6" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>
        <circle cx="12" cy="14" r="3.5" fill="#b8321e" stroke="#6b1a0a" stroke-width="1"/>
      </svg>
      <span class="badge">1</span>
    </div>
    <div class="azione" title="Suona campana">
      <svg viewBox="0 0 24 24">
        <path d="M12 3c-4 0-6 3-6 8 0 3-1 4-2 5h16c-1-1-2-2-2-5 0-5-2-8-6-8z" fill="#b8963e" stroke="#3a2a1a" stroke-width="1.5"/>
        <circle cx="12" cy="19" r="2" fill="#3a2a1a"/>
      </svg>
    </div>
  </div>

  <div class="piè">niente GPS · niente distanze · solo la bussola sa</div>
</div>

<script>
  // Legenda cliccabile
  document.querySelectorAll('.legenda-item').forEach(function(item) {
    item.addEventListener('click', function() {
      document.querySelectorAll('.legenda-item').forEach(function(i) { i.classList.remove('sel'); });
      this.classList.add('sel');
      var tipo = this.dataset.tipo;
      
      // Affievolisci tutte le lancette
      document.querySelectorAll('.lancetta').forEach(function(l) {
        l.style.opacity = '0.2';
      });
      // Illumina quella selezionata
      var sel = document.querySelector('.lancetta-' + tipo);
      if (sel) sel.style.opacity = '1';
    });
  });

  // Azioni (feedback)
  document.querySelectorAll('.azione').forEach(function(a) {
    a.addEventListener('click', function() {
      this.style.transform = 'scale(0.9)';
      setTimeout(function() { a.style.transform = ''; }, 150);
    });
  });
</script>
</body>
</html>
