<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tema VEGGENTE — Atlante Stellato</title>
<style>
  /* ═══════════════════════════════════════════
     TEMA VEGGENTE — "Atlante Stellato"
     Blu notte, argento, oro, viola tenue.
     Costellazioni, occhi, sfere armillari,
     carte stellari, numeri antichi.
     Layout: a mappa celeste, costellazioni,
     atlante, linee di соединение.
     ═══════════════════════════════════════════ */
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel+Decorative&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    /* Cielo notturno profondo */
    background:#050810;
    background-image:
      /* stelleúltiples */
      radial-gradient(1.5px 1.5px at 12% 18%, rgba(200,210,240,.7) 50%, transparent 51%),
      radial-gradient(1px 1px at 78% 12%, rgba(200,210,240,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 55% 40%, rgba(180,190,230,.4) 50%, transparent 51%),
      radial-gradient(2px 2px at 90% 55%, rgba(220,225,250,.6) 50%, transparent 51%),
      radial-gradient(1px 1px at 30% 70%, rgba(180,190,230,.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 65% 85%, rgba(200,210,240,.5) 50%, transparent 51%),
      radial-gradient(1px 1px at 8% 92%, rgba(200,210,240,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 42% 8%, rgba(180,190,230,.4) 50%, transparent 51%),
      radial-gradient(1px 1px at 25% 55%, rgba(170,180,220,.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 30%, rgba(200,210,240,.45) 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 75%, rgba(180,190,230,.35) 50%, transparent 51%),
      radial-gradient(1px 1px at 15% 35%, rgba(170,180,220,.3) 50%, transparent 51%),
      /* nebulosa centrale */
      radial-gradient(ellipse 60% 50% at 50% 50%, rgba(60,50,100,.15) 0%, transparent 70%);
    color:#c8cfe8;
    font-family:'Cormorant Garamond', Georgia, serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px 10px;
  }
  .atlante {
    width:min(430px, 100%);
    background:#0a0e1a;
    background-image:
      radial-gradient(ellipse 80% 60% at 50% 40%, rgba(40,45,80,.2), transparent),
      radial-gradient(1px 1px at 20% 30%, rgba(180,190,220,.2) 50%, transparent 51%),
      radial-gradient(1px 1px at 60% 70%, rgba(180,190,220,.15) 50%, transparent 51%),
      radial-gradient(1px 1px at 80% 20%, rgba(180,190,220,.2) 50%, transparent 51%);
    border:1px solid #2a3050;
    border-radius:4px;
    box-shadow:
      inset 0 0 60px rgba(0,0,0,.7),
      0 12px 40px rgba(0,0,0,.7),
      0 0 0 2px #050810,
      0 0 0 3px #1a2040;
    padding:24px 18px;
    position:relative;
  }
  /* Bordi decorativi stile atlante */
  .atlante::before {
    content:''; position:absolute; inset:8px; pointer-events:none;
    border:1px solid #3a4060;
    background:
      /* rosa dei venti agli angoli */
      radial-gradient(circle at 0 0, #4a5080 0 6px, transparent 7px),
      radial-gradient(circle at 100% 0, #4a5080 0 6px, transparent 7px),
      radial-gradient(circle at 0 100%, #4a5080 0 6px, transparent 7px),
      radial-gradient(circle at 100% 100%, #4a5080 0 6px, transparent 7px);
  }

  /* Sfera armillare come header */
  .armillare {
    width:80px; height:80px; margin:0 auto 14px; position:relative;
  }
  .armillare .anello {
    position:absolute; border:1.5px solid #6a7090; border-radius:50%;
  }
  .armillare .a1 { inset:0; }
  .armillare .a2 { inset:8px; transform:rotateX(60deg); border-color:#5a6080; }
  .armillare .a3 { inset:16px; transform:rotateY(60deg); border-color:#4a5070; }
  .armillare .a4 { inset:24px; background:radial-gradient(circle at 35% 30%, #2a3050, #0a0e1a); border-color:#8a90b0; }
  .armillare .polo {
    position:absolute; top:50%; left:50%; width:4px; height:4px;
    background:#c8d0f0; border-radius:50%; transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(200,208,240,.6);
  }
  /* Assi dell'armillare */
  .armillare::before, .armillare::after {
    content:''; position:absolute; background:#3a4060;
  }
  .armillare::before { top:0; bottom:0; left:50%; width:1px; transform:translateX(-50%); }
  .armillare::after { left:0; right:0; top:50%; height:1px; transform:translateY(-50%); }

  .titolo {
    font-family:'Cinzel Decorative', serif;
    font-size:20px; letter-spacing:3px; color:#b8c4e8;
    text-align:center; text-shadow:0 0 15px rgba(184,196,232,.3);
  }
  .sottotitolo {
    text-align:center; font-style:italic; font-size:13px;
    color:#7a84a8; margin-top:4px; letter-spacing:1px;
  }

  /* Costellazioni come "sigilli" */
  .costellazioni {
    display:flex; justify-content:center; gap:14px; margin:16px 0;
  }
  .costellazione {
    width:48px; height:48px; position:relative; cursor:pointer; transition:.3s;
  }
  .costellazione .stella {
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:#e8ecf8; box-shadow:0 0 6px rgba(232,236,248,.8);
  }
  .costellazione .linea {
    position:absolute; height:1px; background:rgba(180,190,220,.4);
    transform-origin:0 50%;
  }
  /* Orsa Maggiore */
  .cost-orsa .stella:nth-child(1){top:8px;left:8px}
  .cost-orsa .stella:nth-child(2){top:8px;left:20px}
  .cost-orsa .stella:nth-child(3){top:14px;left:32px}
  .cost-orsa .stella:nth-child(4){top:26px;left:32px}
  .cost-orsa .stella:nth-child(5){top:26px;left:40px}
  .cost-orsa .stella:nth-child(6){top:20px;left:40px}
  .cost-orsa .stella:nth-child(7){top:32px;left:44px}
  .cost-orsa .linea:nth-child(8){top:9px;left:10px;width:11px;transform:rotate(0deg)}
  .cost-orsa .linea:nth-child(9){top:10px;left:22px;width:13px;transform:rotate(25deg)}
  .cost-orsa .linea:nth-child(10){top:20px;left:33px;width:7px;transform:rotate(90deg)}
  .cost-orsa .linea:nth-child(11){top:27px;left:34px;width:9px;transform:rotate(0deg)}
  .cost-orsa .linea:nth-child(12){top:27px;left:42px;width:11px;transform:rotate(-30deg)}
  .cost-orsa .linea:nth-child(13){top:21px;left:41px;width:12px;transform:rotate(55deg)}
  .costellazione:hover, .costellazione.sel {
    filter:drop-shadow(0 0 8px rgba(184,196,232,.5));
    transform:scale(1.1);
  }
  /* Cassiopea */
  .cost-cass .stella:nth-child(1){top:10px;left:10px}
  .cost-cass .stella:nth-child(2){top:18px;left:20px}
  .cost-cass .stella:nth-child(3){top:10px;left:30px}
  .cost-cass .stella:nth-child(4){top:22px;left:38px}
  .cost-cass .stella:nth-child(5){top:30px;left:24px}
  /* Dragone */
  .cost-dra .stella:nth-child(1){top:8px;left:24px}
  .cost-dra .stella:nth-child(2){top:16px;left:14px}
  .cost-dra .stella:nth-child(3){top:24px;left:30px}
  .cost-dra .stella:nth-child(4){top:32px;left:20px}
  .cost-dra .stella:nth-child(5){top:38px;left:34px}

  /* Mappa del cerchio come costellazione */
  .mappa-cerchio {
    position:relative; width:250px; height:250px; margin:16px auto;
    border:1px solid #2a3050; border-radius:50%;
    background:radial-gradient(circle, rgba(50,55,90,.15) 0%, transparent 70%);
  }
  /* Griglia sferica */
  .mappa-cerchio::before {
    content:''; position:absolute; inset:8px; border-radius:50%;
    border:1px dashed #1a2040;
    background:
      linear-gradient(90deg, transparent 48%, #1a2040 48% 52%, transparent 52%),
      linear-gradient(0deg, transparent 48%, #1a2040 48% 52%, transparent 52%);
  }
  .mappa-cerchio::after {
    content:''; position:absolute; inset:30%; border-radius:50%;
    border:1px solid #252b48;
  }
  /* Croce di puntamento */
  .puntamento {
    position:absolute; inset:0; pointer-events:none;
  }
  .puntamento line { stroke:#3a4060; stroke-width:.5; stroke-dasharray:2 4; }

  .sfera-centro {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #1a2040, #050810);
    border:2px solid #6a7090;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 20px rgba(106,112,144,.3), inset 0 2px 8px rgba(0,0,0,.6);
  }
  .sfera-centro::after { content:'👁'; font-size:22px; filter:drop-shadow(0 0 6px rgba(184,196,232,.5)); }

  .nodo-stella {
    position:absolute; width:36px; height:36px; cursor:pointer; transition:.3s;
  }
  .nodo-stella . nucleo {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:8px; height:8px; border-radius:50%; background:#e8ecf8;
    box-shadow:0 0 10px rgba(232,236,248,.8), 0 0 20px rgba(200,210,240,.4);
  }
  .nodo-stella . alone {
    position:absolute; inset:-6px; border-radius:50%;
    border:1px solid rgba(180,190,220,.2);
    animation:pulseStar 2.5s ease-in-out infinite;
  }
  @keyframes pulseStar {
    0%,100% { transform:scale(.8); opacity:.3; }
    50% { transform:scale(1.3); opacity:.7; }
  }
  .nodo-stella .etichetta {
    position:absolute; bottom:-16px; left:50%; transform:translateX(-50%);
    font-size:9px; color:#7a84a8; font-style:italic; white-space:nowrap;
    letter-spacing:1px; font-family:'Cinzel', serif;
  }
  .nodo-stella:hover .nucleo { box-shadow:0 0 15px rgba(232,236,248,1), 0 0 30px rgba(200,210,240,.6); }
  .ns1 { top:8%; left:50%; transform:translateX(-50%); }
  .ns2 { bottom:18%; left:10%; }
  .ns3 { bottom:18%; right:10%; }

  /* Rubrica stellare */
  .rubrica {
    font-family:'Cinzel', serif; font-size:11px; letter-spacing:4px;
    color:#8a94b8; text-align:center; margin:16px 0 8px;
    text-transform:uppercase;
  }
  .rubrica::before, .rubrica::after { content:' ✦ '; color:#5a6080; font-size:9px; }

  /* Segnali come stelle che si accendono */
  .segnali-stella {
    display:flex; justify-content:center; gap:20px; margin:12px 0;
    padding:14px 0; border-top:1px solid #1a2040; border-bottom:1px solid #1a2040;
  }
  .segnale-stella {
    text-align:center; cursor:pointer; transition:.3s; position:relative;
    width:44px; height:44px;
  }
  .segnale-stella .stella-base {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:10px; height:10px; background:#3a4060; border-radius:50%;
    transition:.3s;
  }
  .segnale-stella .raggi {
    position:absolute; top:50%; left:50%; width:28px; height:28px;
    transform:translate(-50%,-50%);
  }
  .segnale-stella .raggi line {
    stroke:#3a4060; stroke-width:1; transition:.3s;
  }
  .segnale-stella.accesa .stella-base {
    background:#e8ecf8; box-shadow:0 0 10px rgba(232,236,248,.8), 0 0 20px rgba(200,210,240,.5);
  }
  .segnale-stella.accesa .raggi line { stroke:#b8c4e8; }
  .segnale-stella span {
    position:absolute; bottom:-14px; left:50%; transform:translateX(-50%);
    font-size:8px; color:#5a6080; font-family:'Cinzel', serif;
    letter-spacing:1px; text-transform:uppercase; white-space:nowrap;
  }

  /* Congrega come ammasso stellare */
  .ammasso {
    text-align:center; margin-top:14px;
  }
  .ammasso .gruppo {
    position:relative; width:120px; height:60px; margin:0 auto;
  }
  .ammasso .galassia {
    position:absolute; width:6px; height:6px; border-radius:50%;
    background:#c8d0f0; box-shadow:0 0 4px rgba(200,208,240,.6);
    cursor:pointer; transition:.2s;
  }
  .ammasso .galassia:hover { transform:scale(2); box-shadow:0 0 10px rgba(232,236,248,.9); }
  .ammasso .nome-ammasso {
    font-family:'Cinzel Decorative', serif; font-size:12px; color:#b8c4e8;
    letter-spacing:2px; margin-top:8px;
  }

  .piè {
    text-align:center; margin-top:18px; font-size:10px; color:#4a5070;
    font-style:italic; letter-spacing:1px;
  }
  .piè::before { content:'✧ '; color:#6a7090; }

  .back { margin-top:16px; text-align:center; }
  .back a {
    font-family:'Cinzel', serif; font-size:10px; letter-spacing:2px;
    color:#6a7090; text-decoration:none; text-transform:uppercase;
  }
  .back a:hover { color:#b8c4e8; }
</style>
</head>
<body>

<div class="atlante">
  <div class="armillare">
    <div class="anello a1"></div><div class="anello a2"></div>
    <div class="anello a3"></div><div class="anello a4"></div>
    <div class="polo"></div>
  </div>
  <div class="titolo">Atlante Stellato</div>
  <div class="sottotitolo">— tema del Veggente —</div>

  <div class="costellazioni">
    <div class="costellazione cost-orsa sel" title="Orsa Maggiore">
      <div class="stella"></div><div class="stella"></div><div class="stella"></div><div class="stella"></div>
      <div class="stella"></div><div class="stella"></div><div class="stella"></div>
      <div class="linea"></div><div class="linea"></div><div class="linea"></div><div class="linea"></div>
      <div class="linea"></div><div class="linea"></div>
    </div>
    <div class="costellazione cost-cass" title="Cassiopea">
      <div class="stella"></div><div class="stella"></div><div class="stella"></div><div class="stella"></div><div class="stella"></div>
    </div>
    <div class="costellazione cost-dra" title="Dragone">
      <div class="stella"></div><div class="stella"></div><div class="stella"></div><div class="stella"></div><div class="stella"></div>
    </div>
  </div>

  <div class="rubrica">Carta del Cielo · Milano</div>
  <div class="mappa-cerchio">
    <svg class="puntamento" viewBox="0 0 250 250">
      <line x1="125" y1="125" x2="125" y2="25"/>
      <line x1="125" y1="125" x2="35" y2="200"/>
      <line x1="125" y1="125" x2="215" y2="200"/>
      <line x1="20" y1="125" x2="230" y2="125"/>
      <line x1="125" y1="20" x2="125" y2="230"/>
    </svg>
    <div class="sfera-centro"></div>
    <div class="nodo-stella ns1"><div class="alone"></div><div class="nucleo"></div><span class="etichetta">Luna Rossa</span></div>
    <div class="nodo-stella ns2"><div class="alone"></div><div class="nucleo"></div><span class="etichetta">Corvo Nero</span></div>
    <div class="nodo-stella ns3"><div class="alone"></div><div class="nucleo"></div><span class="etichetta">Salice</span></div>
  </div>

  <div class="rubrica">Accendi una Stella</div>
  <div class="segnali-stella">
    <div class="segnale-stella accesa" onclick="toggleStella(this)" title="Visione in corso">
      <div class="stella-base"></div>
      <svg class="raggi" viewBox="0 0 28 28"><line x1="14" y1="2" x2="14" y2="26"/><line x1="2" y1="14" x2="26" y2="14"/><line x1="5" y1="5" x2="23" y2="23"/><line x1="23" y1="5" x2="5" y2="23"/></svg>
      <span>visione</span>
    </div>
    <div class="segnale-stella" onclick="toggleStella(this)" title="Pericolo stellare">
      <div class="stella-base"></div>
      <svg class="raggi" viewBox="0 0 28 28"><line x1="14" y1="2" x2="14" y2="26"/><line x1="2" y1="14" x2="26" y2="14"/><line x1="5" y1="5" x2="23" y2="23"/><line x1="23" y1="5" x2="5" y2="23"/></svg>
      <span>allarme</span>
    </div>
    <div class="segnale-stella" onclick="toggleStella(this)" title="Clarezza">
      <div class="stella-base"></div>
      <svg class="raggi" viewBox="0 0 28 28"><line x1="14" y1="2" x2="14" y2="26"/><line x1="2" y1="14" x2="26" y2="14"/><line x1="5" y1="5" x2="23" y2="23"/><line x1="23" y1="5" x2="5" y2="23"/></svg>
      <span>chiarezza</span>
    </div>
    <div class="segnale-stella" onclick="toggleStella(this)" title="Chiedo guida">
      <div class="stella-base"></div>
      <svg class="raggi" viewBox="0 0 28 28"><line x1="14" y1="2" x2="14" y2="26"/><line x1="2" y1="14" x2="26" y2="14"/><line x1="5" y1="5" x2="23" y2="23"/><line x1="23" y1="5" x2="5" y2="23"/></svg>
      <span>guida</span>
    </div>
  </div>

  <div class="rubrica">Ammasso della Veggente</div>
  <div class="ammasso">
    <div class="gruppo">
      <div class="galassia" style="top:10px;left:20px" title="Tu"></div>
      <div class="galassia" style="top:25px;left:45px" title="Luna Rossa"></div>
      <div class="galassia" style="top:15px;left:70px" title="Corvo Nero"></div>
      <div class="galassia" style="top:35px;left:30px" title="Salice"></div>
      <div class="galassia" style="top:40px;left:60px"></div>
      <div class="galassia" style="top:28px;left:90px"></div>
      <div class="galassia" style="top:45px;left:50px"></div>
      <div class="galassia" style="top:20px;left:100px"></div>
    </div>
    <div class="nome-ammasso">✧ Stella Fissa ✧</div>
  </div>

  <div class="piè">niente GPS · niente nomi veri · il cielo non ha longitudine</div>
</div>

<div class="back">
  <a href="index.html">← Torna ai temi</a> · Tema 5/6: VEGGENTE
</div>

<script>
  function toggleStella(el){el.classList.toggle('accesa');}
  document.querySelectorAll('.costellazione').forEach(c=>c.addEventListener('click',()=>{
    document.querySelectorAll('.costellazione').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
  }));
</script>
</body>
</html>
