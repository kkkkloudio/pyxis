<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="notte" cx="72%" cy="10%" r="130%">
      <stop offset="0" stop-color="#131c2c"/>
      <stop offset=".6" stop-color="#0d1222"/>
      <stop offset="1" stop-color="#0a0c14"/>
    </radialGradient>
    <linearGradient id="ottone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d5ac"/>
      <stop offset=".5" stop-color="#d9bf8c"/>
      <stop offset="1" stop-color="#bfa170"/>
    </linearGradient>
    <radialGradient id="faccia" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#f0e0b8"/>
      <stop offset=".75" stop-color="#e2cc9c"/>
      <stop offset="1" stop-color="#cfae7a"/>
    </radialGradient>
  </defs>

  <!-- la notte, dietro tutto -->
  <rect width="512" height="512" fill="url(#notte)"/>
  <circle cx="86" cy="92" r="2" fill="#d6def0" opacity=".55"/>
  <circle cx="430" cy="128" r="1.6" fill="#d6def0" opacity=".45"/>
  <circle cx="394" cy="430" r="1.8" fill="#e8cd85" opacity=".4"/>
  <circle cx="112" cy="398" r="1.4" fill="#d6def0" opacity=".35"/>
  <circle cx="466" cy="368" r="1.3" fill="#d6def0" opacity=".3"/>

  <!-- la porta d'ottone, in alto, col suo lume -->
  <ellipse cx="256" cy="62" rx="34" ry="18" fill="#e8cd85" opacity=".14"/>
  <polygon points="240,58 272,58 256,82" fill="#e8cd85"/>

  <!-- la bussola -->
  <circle cx="256" cy="256" r="186" fill="none" stroke="url(#ottone)" stroke-width="13"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="#8a6a44" stroke-width="1.6"/>
  <circle cx="256" cy="256" r="170" fill="url(#faccia)" stroke="#8a6a44" stroke-width="2"/>

  <!-- la rosa dei venti -->
  <polygon points="256,148 262,256 256,364 250,256" fill="#241a10"/>
  <polygon points="148,256 256,250 364,256 256,262" fill="#241a10"/>
  <g transform="rotate(45 256 256)">
    <polygon points="256,184 261,256 256,328 251,256" fill="#3c2e1c"/>
    <polygon points="184,256 256,251 328,256 256,261" fill="#3c2e1c"/>
  </g>

  <!-- la gemma rossa della lancetta -->
  <circle cx="256" cy="206" r="17" fill="#963426" stroke="#241708" stroke-width="2.5"/>
  <circle cx="251" cy="201" r="5" fill="rgba(255,246,220,.75)"/>

  <!-- il perno -->
  <circle cx="256" cy="256" r="9" fill="#241708" stroke="url(#ottone)" stroke-width="2"/>
</svg>
