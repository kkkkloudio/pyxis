<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pyxis — La Bussola</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background:#f5efe0;
    background-image:url('assets/parchment.jpg');
    background-size:cover;
    display:flex; justify-content:center; align-items:center;
    padding:20px;
    font-family:'Cormorant Garamond', Georgia, serif;
    overflow:hidden;
  }

  /* ===== SMARTPHONE ===== */
  .phone {
    position:relative;
    width:390px; height:844px;
    border-radius:44px;
    background:#0a0a0a;
    box-shadow:
      0 0 0 4px #1a1a1a,
      0 0 0 8px #000,
      0 40px 100px rgba(0,0,0,.7),
      inset 0 0 80px rgba(0,0,0,.4);
    overflow:hidden;
  }
  .phone::before {
    content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:150px; height:28px; background:#000; border-radius:0 0 18px 18px; z-index:200;
  }

  /* ===== SCHERMO ===== */
  .screen {
    position:absolute; inset:10px;
    border-radius:36px; overflow:hidden;
    background:#fdfbf5;
    background-image:url('assets/parchment-mobile.jpg');
    background-size:cover;
  }
  .screen::after {
    content:''; position:absolute; inset:0;
    background:rgba(252, 248, 238, 0.55);
    pointer-events:none;
  }
  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(60,40,20,.18) 100%);
    pointer-events:none; z-index:5;
  }

  /* ===== CONTENUTO ===== */
  .content {
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:60px 24px 24px;
    z-index:10;
  }

  /* ===== TITOLO ===== */
  .titolo {
    font-family:'Cinzel', serif;
    font-size:26px; font-weight:700; letter-spacing:6px;
    color:#1a0f08; text-align:center;
    text-shadow:0 1px 3px rgba(255,255,255,.9);
    margin-bottom:4px;
  }
  .sottotitolo {
    font-family:'IM Fell English', serif;
    font-size:13px; color:#4a3520; font-style:italic; text-align:center;
    text-shadow:0 1px 2px rgba(255,255,255,.8);
    margin-bottom:24px;
  }

  /* ===== BUSSOLA GRANDE ===== */
  .bussola-wrap {
    position:relative;
    width:300px; height:300px;
    filter:drop-shadow(3px 6px 10px rgba(40,25,10,.35));
  }
  .bussola-bg {
    position:absolute; inset:0;
    background:url('assets/compass-big.png') center/contain no-repeat;
  }
  .lancetta {
    position:absolute; bottom:50%; left:50%;
    transform-origin:bottom center;
    transition:transform 1.2s cubic-bezier(.4,0,.2,1), opacity .3s;
  }
  .lancetta img { display:block; filter:drop-shadow(1px 2px 3px rgba(0,0,0,.4)); }

  .lancetta.grande { width:44px; margin-left:-22px; transform:rotate(-50deg); z-index:4; }
  .lancetta.grande img { width:44px; }
  .lancetta.media { width:34px; margin-left:-17px; transform:rotate(40deg); z-index:3; }
  .lancetta.media img { width:34px; }
  .lancetta.piccola { width:26px; margin-left:-13px; transform:rotate(160deg); z-index:5; }
  .lancetta.piccola img { width:26px; }

  .perno {
    position:absolute; top:50%; left:50%;
    width:24px; height:24px; margin:-12px 0 0 -12px;
    background:radial-gradient(circle at 35% 30%, #b8963e, #6b5230);
    border:3px solid #1a0f08; border-radius:50%;
    box-shadow:0 2px 6px rgba(0,0,0,.5);
    z-index:10;
  }

  /* ===== LEGENDA ===== */
  .legenda {
    margin-top:28px;
    width:100%; max-width:320px;
    background:rgba(255,252,245,.92);
    border:2px solid #2a1a0a;
    border-radius:10px;
    padding:14px 18px;
    box-shadow:0 4px 12px rgba(40,25,10,.2);
  }
  .legenda-titolo {
    font-family:'Cinzel', serif;
    font-size:11px; font-weight:700; letter-spacing:2px;
    color:#1a0f08; text-align:center; margin-bottom:10px;
    text-transform:uppercase;
  }
  .legenda-item {
    display:flex; align-items:center; gap:12px;
    padding:8px 6px;
    border-bottom:1px solid #d4c4a0;
    cursor:pointer; transition:.15s;
    border-radius:4px;
  }
  .legenda-item:last-child { border-bottom:none; }
  .legenda-item:hover, .legenda-item.sel { background:#f0e6cc; }

  .legenda-item .barra {
    width:34px; flex-shrink:0; border-radius:3px;
    border:2px solid #1a0f08;
  }
  .barra.grande { height:10px; background:#8270b4; }
  .barra.media { height:8px; background:#5a4189; }
  .barra.piccola { height:6px; background:#b8963e; }

  .legenda-item .testo { flex:1; }
  .legenda-item .nome {
    font-family:'Cormorant Garamond', serif;
    font-size:16px; font-weight:700; color:#1a0f08;
  }
  .legenda-item .dett {
    font-family:'IM Fell English', serif;
    font-size:12px; color:#4a3520; font-style:italic;
  }
  .legenda-item .tag {
    font-family:'Cinzel', serif;
    font-size:9px; font-weight:600; letter-spacing:.5px;
    color:#5a4530; text-transform:uppercase;
    background:#e8dcc0; padding:2px 8px; border-radius:10px;
    border:1px solid #c4b088;
  }

  /* ===== NOTA ===== */
  .nota {
    position:absolute; bottom:24px; left:0; right:0;
    text-align:center;
    font-family:'IM Fell English', serif;
    font-size:11px; color:#4a3520; font-style:italic;
    text-shadow:0 1px 2px rgba(255,255,255,.8);
    z-index:10;
  }

  .pyxis-label {
    position:absolute; bottom:8px; left:20px;
    font-family:'IM Fell English', serif;
    font-size:9px; color:#8a7a5a; z-index:10;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="vignette"></div>

    <div class="content">
      <div class="titolo">PYXIS</div>
      <div class="sottotitolo">la bussola delle anime</div>

      <!-- BUSSOLA GRANDE CENTRALE -->
      <div class="bussola-wrap">
        <div class="bussola-bg"></div>
        <div class="lancetta piccola" data-tipo="piccola"><img src="assets/hand-small.png" alt=""></div>
        <div class="lancetta media" data-tipo="media"><img src="assets/hand-medium.png" alt=""></div>
        <div class="lancetta grande" data-tipo="grande"><img src="assets/hand-large.png" alt=""></div>
        <div class="perno"></div>
      </div>

      <!-- LEGENDA: SOLO LE 3 LANCETTE -->
      <div class="legenda">
        <div class="legenda-titolo">Le tre lancette</div>
        <div class="legenda-item sel" data-tipo="grande">
          <div class="barra grande"></div>
          <div class="testo">
            <div class="nome">Luna Rossa</div>
            <div class="dett">anima più vicina</div>
          </div>
          <div class="tag">vicina</div>
        </div>
        <div class="legenda-item" data-tipo="media">
          <div class="barra media"></div>
          <div class="testo">
            <div class="nome">Corvo Nero</div>
            <div class="dett">seconda anima</div>
          </div>
          <div class="tag">dopo</div>
        </div>
        <div class="legenda-item" data-tipo="piccola">
          <div class="barra piccola"></div>
          <div class="testo">
            <div class="nome">Quercia dei Sussurri</div>
            <div class="dett">luogo sacro più vicino</div>
          </div>
          <div class="tag">il sacro</div>
        </div>
      </div>

      <div class="nota">niente GPS · niente distanze · solo la bussola sa</div>
    </div>

    <div class="pyxis-label">Pyxis · V1</div>
  </div>
</div>

<script>
  // Legenda cliccabile: seleziona la lancetta
  document.querySelectorAll('.legenda-item').forEach(function(item) {
    item.addEventListener('click', function() {
      document.querySelectorAll('.legenda-item').forEach(function(i) { i.classList.remove('sel'); });
      this.classList.add('sel');
      var tipo = this.dataset.tipo;
      document.querySelectorAll('.lancetta').forEach(function(l) { l.style.opacity = '0.15'; });
      var sel = document.querySelector('.lancetta.' + tipo);
      if (sel) sel.style.opacity = '1';
    });
  });
</script>
</body>
</html>
