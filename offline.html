<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyxis · si è persa nell'universo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(60% 40% at 50% 20%, #10141f, #05060a 75%);
    color:#e8cd85; font-family: Georgia, 'Cormorant Garamond', serif; text-align:center; padding:24px;
  }
  .luna { font-size:64px; filter: drop-shadow(0 0 18px rgba(232,205,133,.5)); animation: fluttua 5s ease-in-out infinite; }
  h1 { font-size:26px; letter-spacing:6px; margin:18px 0 8px; font-weight:400; }
  p { color:#b9a06a; font-style:italic; max-width:420px; line-height:1.5; }
  .rune { margin-top:26px; letter-spacing:10px; color:#8a7248; font-size:20px; }
  @keyframes fluttua { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-10px); } }
</style>
</head>
<body>
  <div class="luna">🌙</div>
  <h1>PYXIS</h1>
  <p>si è persa un attimo nell'universo.<br>Sta facendo cose magiche e misteriose — ma tornerà.</p>
  <div class="rune">ᚠ ᚢ ᚦ ᚨ ᚱ</div>
</body>
</html>
